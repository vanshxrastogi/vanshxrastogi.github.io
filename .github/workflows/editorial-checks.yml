name: Editorial checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate source and publication safeguards
        run: |
          python3 scripts/validate.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build production (drafts excluded)
        env:
          SITE_URL: https://vanshxrastogi.github.io
        run: python3 scripts/build_pages.py

